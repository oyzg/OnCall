services:
  mysql:
    image: mysql:8.4
    container_name: oncall-demo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oncall
      MYSQL_USER: oncall
      MYSQL_PASSWORD: oncall
    ports:
      - "3306:3306"
    volumes:
      - mysql_demo_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: oncall-demo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_demo_data:/data

  kafka:
    image: apache/kafka:3.9.1
    container_name: oncall-demo-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: oncall-demo-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_demo_data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: oncall-demo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_demo_data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: oncall-demo-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "2379:2379"
    volumes:
      - etcd_demo_data:/etcd

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: oncall-demo-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_demo_data:/var/lib/milvus

  python-ai:
    build:
      context: ../../backend/python-ai
      dockerfile: Dockerfile
    container_name: oncall-demo-python-ai
    environment:
      APP_NAME: python-ai
      APP_ENV: demo
      LOG_LEVEL: INFO
      HTTP_PORT: 8000
      GRPC_PORT: 50051
      OPENAI_BASE_URL: ""
      OPENAI_API_KEY: ""
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MILVUS_ADDRESS: milvus:19530
    depends_on:
      - elasticsearch
      - milvus
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

  go-api:
    build:
      context: ../../backend/go-api
      dockerfile: Dockerfile
    container_name: oncall-demo-go-api
    environment:
      APP_NAME: go-api
      APP_ENV: demo
      LOG_LEVEL: INFO
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      GRPC_AI_TARGET: python-ai:50051
      AI_HTTP_BASE_URL: http://python-ai:8000
      AI_HTTP_TIMEOUT_SECONDS: 8
      AI_GRPC_PING_TIMEOUT_SECONDS: 2
      MYSQL_DSN: oncall:oncall@tcp(mysql:3306)/oncall?charset=utf8mb4&parseTime=True&loc=Local
      MYSQL_PING_TIMEOUT_SECONDS: 2
      REDIS_ADDR: redis:6379
      REDIS_PING_TIMEOUT_SECONDS: 2
      JWT_SECRET: oncall-demo-secret
      JWT_EXPIRES_IN_SECONDS: 86400
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      python-ai:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../../frontend/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8080
    container_name: oncall-demo-web
    depends_on:
      go-api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_demo_data:
  redis_demo_data:
  es_demo_data:
  minio_demo_data:
  etcd_demo_data:
  milvus_demo_data:

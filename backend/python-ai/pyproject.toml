[project]
name = "oncall-python-ai"
version = "0.1.0"
description = "Python AI service for AI OnCall"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.12",
  "langchain>=0.3.21",
  "langgraph>=0.3.20",
  "grpcio>=1.78.0",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "protobuf>=6.31.1",
  "pymilvus>=2.5.5",
  "sentence-transformers>=3.4.1",
  "uvicorn>=0.34.0"
]

[project.optional-dependencies]
codegen = [
  "grpcio-tools==1.78.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
